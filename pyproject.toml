[project]
name = "talks-slide-decks"
version = "0.1.0"
description = "Talk slide decks built with decktile"
requires-python = ">=3.11"
dependencies = ["decktile @ file:///${PROJECT_ROOT}/decktile", "seaborn>=0.13.2", "pillow>=12.3.0", "pytest>=9.1.1", "segno>=1.6.6"]

[tool.pdm]
# Build slides: pdm run decktile <deck>.md

[tool.pdm.workspace]
members = ["decktile"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
